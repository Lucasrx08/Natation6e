<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><meta http-equiv="Cache-Control" content="no-store"><title>Actualiser Natation 6e</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(130deg,#e1fbff,#edf1ff);font-family:system-ui,sans-serif;color:#143f58;padding:24px}main{background:white;border:1px solid #c6e7ef;border-radius:28px;padding:36px;max-width:550px;box-shadow:0 18px 60px #10334d18}h1{font-size:28px;margin:0 0 16px}p{line-height:1.5}a{display:inline-block;background:linear-gradient(110deg,#007ea8,#3758ff);color:white;text-decoration:none;padding:14px 20px;border-radius:14px;font-weight:700;margin-top:14px}.note{font-size:14px;color:#53758a}</style></head>
<body><main><h1>Mise à jour de Natation 6e</h1><p role="status" id="status">Ouverture de la version actuelle…</p><p class="note">Vos classes et vos élèves restent enregistrés sur cet appareil.</p><a id="open" href="./index.html?actualisation=v32-cachefix3">Ouvrir l’application</a></main>
<script>
(async()=>{
 const destination=new URL('./index.html?actualisation=v32-cachefix3',location.href);
 // A previously unused document URL escapes an older cached entry page.
 // Updating only this app's worker leaves localStorage and IndexedDB untouched.
 try{
  if('serviceWorker' in navigator){
   const registration=await navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'});
   await registration.update();
   const worker=registration.installing||registration.waiting;
   if(worker&&worker.state!=='activated')await Promise.race([
    new Promise(resolve=>{worker.addEventListener('statechange',()=>{if(['activated','redundant'].includes(worker.state))resolve()})}),
    new Promise(resolve=>setTimeout(resolve,12000))
   ]);
  }
  await fetch(destination,{cache:'no-store'});
 }catch{}
 location.replace(destination.href);
})();
</script></body></html>
